<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d17a"/>
      <stop offset="50%" style="stop-color:#d4a853"/>
      <stop offset="100%" style="stop-color:#b8923a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="160" height="160" rx="36" ry="36" fill="url(#bgGrad)"/>

  <!-- Inner border for depth -->
  <rect x="14" y="14" width="152" height="152" rx="32" ry="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- The P -->
  <text x="90" y="122"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="112"
        font-weight="700"
        fill="white"
        text-anchor="middle">P</text>

  <!-- Gold accent dot -->
  <circle cx="134" cy="50" r="9" fill="url(#goldAccent)"/>
</svg>
